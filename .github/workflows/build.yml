name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk-path: ${{ steps.upload-apk.outputs.apk-path }}
      version-name: ${{ steps.version.outputs.version-name }}
      version-code: ${{ steps.version.outputs.version-code }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git describe

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Extract version info
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0.0")
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts || echo "1")
          echo "version-name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version-code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK as artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: vibecoder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK (unsigned, skip if no keystore)
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PskipSigning=true
        continue-on-error: true

      - name: Upload Release APK as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibecoder-release-apk
          path: app/build/outputs/apk/release/app-release*.apk
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: vibecoder-debug-apk
          path: artifacts/

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: vibecoder-release-apk
          path: artifacts/
        continue-on-error: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VibeCoder ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/app-debug.apk
            artifacts/app-release*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  nightly:
    name: Update Nightly Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: vibecoder-debug-apk
          path: artifacts/

      - name: Create/Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: VibeCoder Nightly
          draft: false
          prerelease: true
          generate_release_notes: false
          body: |
            ## Nightly Build
            
            **Commit:** ${{ github.sha }}
            **Date:** $(date -u +'%Y-%m-%d %H:%M UTC')
            
            This is an automated nightly build from the `main` branch. Use for testing only.
            
            ### Installation
            1. Download `app-debug.apk` below
            2. Enable "Install unknown apps" in Android settings
            3. Install the APK
            
            ⚠️ **Note:** This is an unsigned debug build. For production, use a tagged release.
          files: |
            artifacts/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7